name: Auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          # Must be a PAT, not the default GITHUB_TOKEN: tags pushed with
          # GITHUB_TOKEN do not trigger other workflows (anti-recursion rule),
          # so the release.yaml (on: push tags) would never fire. HOMEBREW_TAP_TOKEN
          # is a classic PAT with repo scope and is already used by release.yaml.
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          default_bump: patch
